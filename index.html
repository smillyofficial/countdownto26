<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 Party Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a0633; --card: #ffffff; --pink: #ff007f; --cyan: #00f2ff; --yellow: #ffea00;
        }
        * { box-sizing: border-box; touch-action: manipulation; }
        
        body {
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; background: var(--bg);
            font-family: 'Fredoka One', cursive; overflow-x: hidden; color: white;
            padding: 20px; transition: background 0.5s;
        }
        
        #tz-display { position: absolute; top: 15px; font-size: 0.9rem; color: var(--cyan); text-align: center; width: 100%; }
        #fact-box { position: absolute; bottom: 20px; width: 90%; max-width: 400px; background: rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 15px; text-align: center; font-size: 0.8rem; border: 1px dashed var(--cyan); color: var(--yellow); }

        /* Future Screen Styling */
        .future-error { display: none; text-align: center; animation: shake 0.5s infinite; }
        .future-error h2 { font-size: 4rem; color: var(--pink); margin-bottom: 10px; }
        .future-error p { font-size: 1.5rem; color: var(--yellow); }

        h1 { color: var(--yellow); font-size: 2.2rem; text-shadow: 3px 3px 0px var(--pink); margin-bottom: 20px; text-align: center; }

        .countdown-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 400px; }
        .time-box { background: var(--card); border: 4px solid var(--cyan); border-radius: 20px; padding: 10px; display: flex; flex-direction: column; align-items: center; box-shadow: 5px 5px 0px rgba(0,0,0,0.5); }
        .number { font-size: 2.5rem; color: #333; line-height: 1; }
        .label { font-size: 0.8rem; color: var(--pink); }

        #game-sidebar { position: fixed; right: 15px; bottom: 80px; background: var(--yellow); padding: 10px; border-radius: 50%; border: 3px solid var(--pink); cursor: pointer; text-align: center; width: 70px; height: 70px; z-index: 100; color: #333; }

        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; justify-content: flex-start; align-items: center; padding-top: 50px; }
        .modal-content { background: #fff; width: 95%; max-width: 450px; border-radius: 25px; padding: 15px; position: relative; color: #333; text-align: center; }
        .close-btn { position: absolute; top: -10px; right: -10px; background: var(--pink); color: #fff; border-radius: 50%; width: 40px; height: 40px; border: none; cursor: pointer; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
        }

        @media (min-width: 600px) {
            .countdown-container { grid-template-columns: repeat(4, 1fr); max-width: 600px; }
            h1 { font-size: 3.5rem; }
        }
    </style>
</head>
<body onclick="startMusic()">

    <div id="tz-display">Loading Zone...</div>
    <div id="fact-box">Earth Fact: Loading...</div>
    
    <div id="countdown-wrapper">
        <h1>2026 COUNTDOWN</h1>
        <div class="countdown-container">
            <div class="time-box"><span class="number" id="days">00</span><span class="label">Days</span></div>
            <div class="time-box"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
            <div class="time-box"><span class="number" id="minutes">00</span><span class="label">Mins</span></div>
            <div class="time-box"><span class="number" id="seconds">00</span><span class="label">Secs</span></div>
        </div>
    </div>

    <div id="future-screen" class="future-error">
        <h2>Oops error 600</h2>
        <p>You are already in the future 😉<br>tell us what happens!</p>
    </div>

    <div id="game-sidebar" onclick="openGames()">
        <div style="font-size: 1.5rem;">🎮</div>
        <div style="font-size: 0.6rem;">GAMES!</div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeGames()">X</button>
            <h2 style="margin: 5px;">SNAKE</h2>
            <canvas id="gameCanvas" width="300" height="300" style="background: #000; display: block; margin: 10px auto; border-radius: 10px; width: 100%; max-width: 280px;"></canvas>
            <p>Tap games to keep busy!</p>
            <a href="https://neal.fun/" target="_blank" style="color: var(--pink); font-size: 1rem;">✨ More Fun Stuff at Neal.fun ✨</a>
        </div>
    </div>

    <iframe id="lofi" width="0" height="0" src="https://www.youtube.com/embed/E0Om1LC-XeU?enablejsapi=1&loop=1&playlist=E0Om1LC-XeU" frameborder="0"></iframe>

    <script>
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        document.getElementById('tz-display').innerText = `ZONE: ${tz}`;

        const facts = [
            "Earth is the only planet not named after a god.",
            "A day on Earth is actually 23 hours, 56 mins.",
            "The Earth's core is as hot as the sun's surface.",
            "Light takes 8 mins to reach Earth from the Sun.",
            "97% of Earth's water is salty ocean water.",
            "Antarctica is the world's largest desert!"
        ];
        setInterval(() => { document.getElementById('fact-box').innerText = "Earth Fact: " + facts[Math.floor(Math.random()*facts.length)]; }, 10000);

        function update() {
            const now = new Date();
            const target = new Date(2026, 0, 1);
            const diff = target - now;

            // CHECK IF ALREADY 2026
            if (diff <= 0) {
                document.getElementById('countdown-wrapper').style.display = 'none';
                document.getElementById('future-screen').style.display = 'block';
                document.body.style.background = '#000'; // Darken the screen for error feel
                return;
            }

            document.getElementById('days').innerText = String(Math.floor(diff/86400000)).padStart(2,'0');
            document.getElementById('hours').innerText = String(Math.floor((diff%86400000)/3600000)).padStart(2,'0');
            document.getElementById('minutes').innerText = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
            document.getElementById('seconds').innerText = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
        }
        setInterval(update, 1000);
        update();

        // Game and Music logic (unchanged from previous mobile-friendly version)
        let musicStarted = false;
        function startMusic() { if (!musicStarted) { document.getElementById('lofi').src += "&autoplay=1"; musicStarted = true; } }
        const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d");
        let snake = [{x: 10, y: 10}], food = {x: 5, y: 5}, dx = 1, dy = 0;
        function gameLoop() {
            ctx.fillStyle = "black"; ctx.fillRect(0,0,300,300);
            ctx.fillStyle = "lime"; snake.forEach(s => ctx.fillRect(s.x*15, s.y*15, 14, 14));
            ctx.fillStyle = "red"; ctx.fillRect(food.x*15, food.y*15, 14, 14);
            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if(head.x < 0) head.x = 19; if(head.x > 19) head.x = 0;
            if(head.y < 0) head.y = 19; if(head.y > 19) head.y = 0;
            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) {
                food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
            } else { snake.pop(); }
        }
        let gInt;
        function openGames() { document.getElementById('modal').style.display = 'flex'; gInt = setInterval(gameLoop, 150); }
        function closeGames() { document.getElementById('modal').style.display = 'none'; clearInterval(gInt); }
    </script>
</body>
</html>
