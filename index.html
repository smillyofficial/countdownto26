<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Countdown!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    
    <style>
        /* --- CARTOON STYLING --- */
        :root {
            --bg-color: #2c0e37; /* Deep purple night sky */
            --card-bg: #ffffff;
            --text-color: #2c0e37;
            --accent-pink: #ff007f;
            --accent-cyan: #00f2ff;
            --accent-yellow: #ffea00;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.1) 2px, transparent 2.5px),
                radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.1) 2px, transparent 2.5px);
            background-size: 400px 400px;
            font-family: 'Fredoka One', cursive;
            overflow: hidden;
        }

        h1 {
            color: var(--accent-yellow);
            font-size: 3rem;
            text-shadow: 4px 4px 0px var(--accent-pink);
            margin-bottom: 40px;
            letter-spacing: 2px;
            transform: rotate(-2deg); /* Slight cartoon tilt */
            text-align: center;
        }

        .countdown-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .time-box {
            background: var(--card-bg);
            border: 4px solid var(--accent-cyan);
            border-radius: 20px;
            padding: 20px;
            min-width: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            animation: float 3s ease-in-out infinite;
        }

        /* Stagger animations for a playful feel */
        .time-box:nth-child(1) { animation-delay: 0s; }
        .time-box:nth-child(2) { animation-delay: 0.5s; }
        .time-box:nth-child(3) { animation-delay: 1s; }
        .time-box:nth-child(4) { animation-delay: 1.5s; }

        .time-box:hover {
            transform: scale(1.1) rotate(3deg) !important;
            border-color: var(--accent-pink);
        }

        .number {
            font-size: 3.5rem;
            color: var(--text-color);
            line-height: 1;
        }

        .label {
            font-size: 1rem;
            color: var(--accent-pink);
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* Confetti Effect in Background */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: var(--accent-cyan);
            animation: fall linear infinite;
            z-index: -1;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .number { font-size: 2.5rem; }
            .time-box { min-width: 70px; padding: 15px; }
            .countdown-container { gap: 10px; }
        }
    </style>
</head>
<body>

    <div id="confetti-container"></div>

    <h1>COUNTDOWN TO 2026</h1>

    <div class="countdown-container">
        <div class="time-box">
            <span class="number" id="days">00</span>
            <span class="label">Days</span>
        </div>
        
        <div class="time-box">
            <span class="number" id="hours">00</span>
            <span class="label">Hours</span>
        </div>

        <div class="time-box">
            <span class="number" id="minutes">00</span>
            <span class="label">Mins</span>
        </div>

        <div class="time-box">
            <span class="number" id="seconds">00</span>
            <span class="label">Secs</span>
        </div>
    </div>

    <script>
        // --- JAVASCRIPT LOGIC ---

        function updateCountdown() {
            const now = new Date();
            // This creates a date for Jan 1, 2026, 00:00:00 local client time
            const target = new Date(2026, 0, 1, 0, 0, 0); 
            
            const diff = target - now;

            if (diff <= 0) {
                // New Year has arrived!
                document.querySelector("h1").innerText = "HAPPY NEW YEAR 2026!";
                document.querySelector(".countdown-container").innerHTML = "<div class='time-box'><span class='number'>🎉</span></div>";
                return;
            }

            // Calculate time components
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            // Update DOM with zero-padding
            document.getElementById("days").innerText = d < 10 ? "0" + d : d;
            document.getElementById("hours").innerText = h < 10 ? "0" + h : h;
            document.getElementById("minutes").innerText = m < 10 ? "0" + m : m;
            document.getElementById("seconds").innerText = s < 10 ? "0" + s : s;
        }

        // Run immediately and then every second
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // --- OPTIONAL: CREATE SIMPLE CONFETTI ---
        function createConfetti() {
            const colors = ['#ff007f', '#00f2ff', '#ffea00', '#ffffff'];
            const container = document.body;
            
            setInterval(() => {
                const conf = document.createElement('div');
                conf.classList.add('confetti');
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's'; // Random speed
                
                container.appendChild(conf);

                // Remove confetti after animation to prevent memory leak
                setTimeout(() => {
                    conf.remove();
                }, 4000);
            }, 300);
        }

        createConfetti();
    </script>
</body>
</html>
