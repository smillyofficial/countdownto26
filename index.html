<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Party Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a0633; --card: #ffffff; --pink: #ff007f; --cyan: #00f2ff; --yellow: #ffea00;
        }
        body {
            margin: 0; height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; background: var(--bg);
            font-family: 'Fredoka One', cursive; overflow: hidden; color: white;
        }
        
        /* Timezone Header */
        #tz-display {
            position: absolute; top: 20px; font-size: 1.2rem;
            color: var(--cyan); text-shadow: 2px 2px 0px #000;
        }

        h1 {
            color: var(--yellow); font-size: 3rem; text-shadow: 4px 4px 0px var(--pink);
            margin-bottom: 20px; transform: rotate(-1deg); text-align: center;
        }

        .countdown-container { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .time-box {
            background: var(--card); border: 4px solid var(--cyan); border-radius: 20px;
            padding: 15px; min-width: 90px; display: flex; flex-direction: column;
            align-items: center; box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
            animation: float 3s ease-in-out infinite;
        }
        .number { font-size: 3rem; color: #333; }
        .label { font-size: 0.9rem; color: var(--pink); text-transform: uppercase; }

        /* Game Sidebar */
        #game-sidebar {
            position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
            background: var(--yellow); padding: 15px; border-radius: 20px;
            border: 4px solid var(--pink); cursor: pointer; text-align: center;
            box-shadow: -5px 5px 0px rgba(0,0,0,0.3); z-index: 100;
            animation: bounce 2s infinite; color: #333;
        }

        /* Modal */
        #modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 1000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: #fff; width: 100%; max-width: 600px; border-radius: 30px;
            padding: 20px; position: relative; color: #333; text-align: center;
            border: 6px solid var(--cyan);
        }
        .close-btn { position: absolute; top: -15px; right: -15px; background: var(--pink); color: #fff; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; line-height: 40px; font-weight: bold; }

        /* Game Area */
        canvas { background: #000; display: block; margin: 10px auto; border-radius: 10px; max-width: 100%; }
        .neal-link { display: block; margin-top: 15px; color: var(--pink); text-decoration: none; font-size: 1.2rem; border: 2px dashed var(--pink); padding: 5px; border-radius: 10px; }
        .neal-link:hover { background: var(--pink); color: #fff; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes bounce { 0%, 100% { transform: translateY(-50%) translateX(0); } 50% { transform: translateY(-50%) translateX(-10px); } }
    </style>
</head>
<body onclick="startMusic()">

    <div id="tz-display">Detecting location...</div>
    <h1>COUNTDOWN TO 2026</h1>

    <div class="countdown-container" id="countdown">
        <div class="time-box"><span class="number" id="days">00</span><span class="label">Days</span></div>
        <div class="time-box"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
        <div class="time-box"><span class="number" id="minutes">00</span><span class="label">Mins</span></div>
        <div class="time-box"><span class="number" id="seconds">00</span><span class="label">Secs</span></div>
    </div>

    <div id="game-sidebar" onclick="openGames()">
        <div style="font-size: 2rem;">🎮</div>
        <div style="font-size: 0.8rem; width: 80px;">Click to play games till!!</div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <div class="close-btn" onclick="closeGames()">X</div>
            <h2 id="game-title">Snake Time!</h2>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <p>Use Arrow Keys to Move</p>
            <a href="https://neal.fun/" target="_blank" class="neal-link">✨ Click here for more fun stuff (Neal.fun) ✨</a>
        </div>
    </div>

    <iframe id="lofi" width="0" height="0" src="https://www.youtube.com/embed/E0Om1LC-XeU?enablejsapi=1&loop=1&playlist=E0Om1LC-XeU" frameborder="0" allow="autoplay"></iframe>

    <script>
        // 1. Timezone Detection
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const offset = new Date().getTimezoneOffset() / -60;
        document.getElementById('tz-display').innerText = `Your Zone: ${tz} (GMT${offset >= 0 ? '+' : ''}${offset})`;

        // 2. Music Control
        let musicStarted = false;
        function startMusic() {
            if (!musicStarted) {
                const iframe = document.getElementById('lofi');
                iframe.src += "&autoplay=1";
                musicStarted = true;
            }
        }

        // 3. Countdown Logic
        function update() {
            const now = new Date();
            const target = new Date(2026, 0, 1, 0, 0, 0);
            const diff = target - now;

            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);

            document.getElementById('days').innerText = String(d).padStart(2, '0');
            document.getElementById('hours').innerText = String(h).padStart(2, '0');
            document.getElementById('minutes').innerText = String(m).padStart(2, '0');
            document.getElementById('seconds').innerText = String(s).padStart(2, '0');

            // Change color every hour
            const hourColor = ["#ff007f", "#00f2ff", "#ffea00", "#7cff00", "#ff7c00"][h % 5];
            document.querySelectorAll('.time-box').forEach(b => b.style.borderColor = hourColor);
        }
        setInterval(update, 1000);
        update();

        // 4. Snake Game Logic
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0, dy = 0;
        let score = 0;

        function drawGame() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "lime";
            snake.forEach(p => ctx.fillRect(p.x*20, p.y*20, 18, 18));

            ctx.fillStyle = "red";
            ctx.fillRect(food.x*20, food.y*20, 18, 18);

            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if(head.x === food.x && head.y === food.y) {
                food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
            } else {
                if(dx !== 0 || dy !== 0) snake.pop();
            }

            // Boundary wrap
            if(head.x < 0) head.x = 19; if(head.x > 19) head.x = 0;
            if(head.y < 0) head.y = 19; if(head.y > 19) head.y = 0;
        }

        document.addEventListener("keydown", e => {
            if(e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -1; }
            if(e.key === "ArrowDown" && dy === 0) { dx = 0; dy = 1; }
            if(e.key === "ArrowLeft" && dx === 0) { dx = -1; dy = 0; }
            if(e.key === "ArrowRight" && dx === 0) { dx = 1; dy = 0; }
        });

        let gameInt;
        function openGames() { 
            document.getElementById('modal').style.display = 'flex'; 
            gameInt = setInterval(drawGame, 100);
        }
        function closeGames() { 
            document.getElementById('modal').style.display = 'none'; 
            clearInterval(gameInt);
        }
    </script>
</body>
</html>
