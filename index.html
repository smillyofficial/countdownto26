<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 Countdown & Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #1a0633; --pink: #ff007f; --cyan: #00f2ff; --yellow: #ffea00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; min-height: 100vh; background: var(--bg); color: white;
            font-family: 'Fredoka One', cursive; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px; text-align: center;
        }
        #tz-display { position: absolute; top: 10px; font-size: 0.8rem; color: var(--cyan); }
        #fact-box { position: absolute; bottom: 15px; font-size: 0.8rem; color: var(--yellow); width: 80%; }
        
        .countdown-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .time-box { background: white; border: 4px solid var(--cyan); padding: 10px; border-radius: 15px; min-width: 80px; }
        .number { font-size: 2rem; color: #333; display: block; }
        .label { font-size: 0.7rem; color: var(--pink); }

        #game-trigger {
            position: fixed; right: 20px; bottom: 80px; background: var(--yellow);
            width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--pink);
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 99;
        }

        #modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 1000; flex-direction: column; align-items: center; justify-content: center;
        }
        .modal-content { background: white; width: 90%; max-width: 400px; padding: 20px; border-radius: 20px; color: #333; }
        canvas { background: #000; display: block; margin: 10px auto; border-radius: 10px; width: 250px; height: 250px; }
        
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 180px; margin: 10px auto; }
        .btn { background: #ddd; border: none; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1.2rem; }
        .start-btn { background: var(--pink); color: white; padding: 10px 20px; border-radius: 10px; border: none; font-family: inherit; cursor: pointer; }
    </style>
</head>
<body onclick="playBeat()">

    <div id="tz-display">Detecting...</div>
    <h1 id="main-title">2026 COUNTDOWN</h1>

    <div id="countdown-area" class="countdown-container">
        <div class="time-box"><span class="number" id="d">00</span><span class="label">Days</span></div>
        <div class="time-box"><span class="number" id="h">00</span><span class="label">Hours</span></div>
        <div class="time-box"><span class="number" id="m">00</span><span class="label">Mins</span></div>
        <div class="time-box"><span class="number" id="s">00</span><span class="label">Secs</span></div>
    </div>

    <div id="game-trigger" onclick="openModal()">🎮</div>

    <div id="modal">
        <div class="modal-content">
            <button onclick="closeModal()" style="float:right">X</button>
            <h2>SNAKE GAME</h2>
            <canvas id="snakeCanvas" width="300" height="300"></canvas>
            <button class="start-btn" onclick="initSnake()">START / RESET</button>
            <div class="controls">
                <div></div><button class="btn" onclick="changeDir(0,-1)">↑</button><div></div>
                <button class="btn" onclick="changeDir(-1,0)">←</button>
                <button class="btn" onclick="changeDir(0,1)">↓</button>
                <button class="btn" onclick="changeDir(1,0)">→</button>
            </div>
            <a href="https://neal.fun/" target="_blank" style="color:var(--pink); text-decoration:none; font-size:0.8rem;">Click here for more fun stuff (neal.fun)</a>
        </div>
    </div>

    <div id="fact-box">Earth Fact: Loading...</div>
    <div id="player"></div> <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // 1. YouTube Audio Setup
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0', width: '0',
                videoId: 'E0Om1LC-XeU', // Lo-fi beat
                playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': 'E0Om1LC-XeU' },
                events: { 'onReady': (e) => e.target.mute() }
            });
        }
        function playBeat() { if(player) { player.unMute(); player.playVideo(); } }

        // 2. Timezone & Facts
        document.getElementById('tz-display').innerText = "ZONE: " + Intl.DateTimeFormat().resolvedOptions().timeZone;
        const facts = ["Earth is 4.5bn years old", "70% of Earth is water", "Earth is not a perfect sphere", "Oxygen comes from the ocean"];
        setInterval(() => { document.getElementById('fact-box').innerText = "Fact: " + facts[Math.floor(Math.random()*facts.length)]; }, 10000);

        // 3. Countdown Logic
        function updateTimer() {
            const diff = new Date(2026, 0, 1) - new Date();
            if(diff <= 0) {
                document.body.innerHTML = "<h1>Oops error 600</h1><p>You are already in the future 😉 tell us happens!</p>";
                return;
            }
            document.getElementById('d').innerText = Math.floor(diff/86400000);
            document.getElementById('h').innerText = Math.floor((diff%86400000)/3600000);
            document.getElementById('m').innerText = Math.floor((diff%3600000)/60000);
            document.getElementById('s').innerText = Math.floor((diff%60000)/1000);
        }
        setInterval(updateTimer, 1000);

        // 4. Snake Game Logic
        const canvas = document.getElementById("snakeCanvas");
        const ctx = canvas.getContext("2d");
        let snake, food, dx, dy, gameLoop;

        function initSnake() {
            clearInterval(gameLoop);
            snake = [{x: 10, y: 10}];
            food = {x: 5, y: 5};
            dx = 1; dy = 0;
            gameLoop = setInterval(draw, 150);
        }

        function changeDir(x, y) { dx = x; dy = y; }

        function draw() {
            ctx.fillStyle = "black"; ctx.fillRect(0,0,300,300);
            ctx.fillStyle = "lime"; snake.forEach(p => ctx.fillRect(p.x*15, p.y*15, 14, 14));
            ctx.fillStyle = "red"; ctx.fillRect(food.x*15, food.y*15, 14, 14);
            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if(head.x<0) head.x=19; if(head.x>19) head.x=0;
            if(head.y<0) head.y=19; if(head.y>19) head.y=0;
            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) {
                food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
            } else { snake.pop(); }
        }

        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; clearInterval(gameLoop); }
    </script>
</body>
</html>
